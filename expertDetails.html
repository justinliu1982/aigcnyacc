    <!-- 容器：用于插入底部 -->
    <div id="footerContainer"></div>

    <!-- 动态加载公共部分 -->
    <script>
      // 加载公共文件的函数
      async function loadCommonPart(url, containerId) {
        try {
          const response = await fetch(url);
          const html = await response.text();
          document.getElementById(containerId).innerHTML = html;
          if (containerId === "headerContainer") {
            // 动态导入 header.js
            const { initHeader } = await import("./header.js");
            // 给一点延迟确保 DOM 完全渲染
            setTimeout(initHeader, 10);
          }
        } catch (error) {
          console.error("加载公共部分失败：", error);
        }
      }

      // 加载头部和底部
      loadCommonPart("./header.html", "headerContainer");
      loadCommonPart("./footer.html", "footerContainer");
    </script>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大赛动态</title>
    <script src="./browser@4.js"></script>
  </head>
  <style>
    * {
      line-height: normal;
    }
    html {
      font-family: "PingFang SC", "Roboto", "Microsoft YaHei", "Helvetica Neue";
    }
    .navItem {
      color: var(---60, rgba(0, 0, 0, 0.6));
      font-size: 16px;
      font-weight: 500;
      line-height: 44px;
      width: 140px;
      text-align: center;
    }

    .active {
      color: #fff;
      border-radius: 30px;
      background: var(--Color, #9162ff);
    }
    .banner_bg {
      background-image: url("./img/competition_bg.png");
      background-repeat: no-repeat;
      background-size: cover;
      background-position: 0;
    }
    .hover_item {
      cursor: pointer;
    }
  </style>

  <body>
    <!-- 关于 -->
    <!-- 容器：用于插入头部 -->
    <div id="headerContainer"></div>

    <!-- 中间独有的内容 -->
    <main class="text-center">
      <div class="w-[800px] mt-[84px] m-auto">
        <div class="flex items-center">
          <span
            class="text-xs text-white px-3 py-1"
            style="border-radius: 4px; background: #ff6265"
            >公告通知</span
          >
          <span class="ml-10 text-black/60 text-xs"
            >发布时间：2026-05-28 11:14 &nbsp;北京
          </span>
          <span class="ml-10 text-black/60 text-xs"
            >来源：AIGCNYACC大赛官方</span
          >
        </div>
        <div class="mt-10 font-medium text-[32px] text-left">
          第一届“全国青少年人工智能辅助生成数字艺术创作者大赛”个人官网报名电脑端操作说明
        </div>
        <div class="mt-[40px]">
          <img class="mt-[10px]" src="./img/pc_1.png" alt="">
          <img src="./img/pc_2.png" alt="">
          <img src="./img/pc_3.png" alt="">
        </div>
        <div class="w-full h-[1px] bg-black/20 mt-[120px] mb-[20px]"></div>
           <a href="./competitionTheme.html?id=dynamic">
            <div class="text-left pl-[20px] text-black/80 text-sm font-normal">
              上一篇
            </div>
          </a>
          <a href="./competitionTheme.html?id=dynamic">
            <div
              class="w-[800px] flex mt-[12px] items-center px-4 pt-5 pb-5 pb-3"
              style="
                box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.08);
                background: var(---100, #fff);
                border-radius: 20px;
              "
            >
              <div class="flex-1 text-left pr-10">
                <div class="text-base">
                 “全国青少年人工智能辅助生成数字艺术创作者大赛”主题公布通知
                </div>
                
                <div class="mt-[10px]">
                  <span
                    class="px-3 py-1 text-white rounded-xl text-xs"
                    style="background-color: #ff6265"
                    >公告通知</span
                  >
                  <span class="pl-3 text-black/60 text-xs">2026.05.29</span>
                </div>
              </div>
            </div>
          </a>
          <a href="./mobileAnnouncement.html?id=dynamic">
            <div
              class="text-left mt-[20px] pl-[20px] text-black/80 text-sm font-normal"
            >
              下一篇
            </div>
          </a>
          <a href="./mobileAnnouncement.html?id=dynamic">
            <div
              class="w-[800px] mb-[150px] hover_item flex mt-[12px] items-center px-4 pt-5 pb-5 pb-3"
              style="
                box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.08);
                background: #fff;
                border-radius: 20px;
              "
            >
              <div class="flex-1 text-left pr-10">
                <div class="text-base">
                  第一届全国青少年人工智能辅助生成数字艺术创作者大赛报名手机版图解速览
                </div>
                <div class="mt-[10px]">
                  <span
                    class="px-3 py-1 text-white rounded-xl text-xs"
                    style="background-color: #ff6265"
                    >公告通知</span
                  >
                  <span class="pl-3 text-black/60 text-xs">2026.05.22</span>
                </div>
              </div>
            </div>
          </a>
      </div>
    </main>

    <!-- 容器：用于插入底部 -->
    <div id="footerContainer"></div>

    <!-- 动态加载公共部分 -->
    <script>
      // 加载公共文件的函数
      async function loadCommonPart(url, containerId) {
        try {
          const response = await fetch(url);
          const html = await response.text();
          document.getElementById(containerId).innerHTML = html;
          if (containerId === "headerContainer") {
            // 动态导入 header.js
            const { initHeader } = await import("./header.js");
            // 给一点延迟确保 DOM 完全渲染
            setTimeout(initHeader, 10);
          }
        } catch (error) {
          console.error("加载公共部分失败：", error);
        }
      }

      // 加载头部和底部
      loadCommonPart("./header.html", "headerContainer");
      loadCommonPart("./footer.html", "footerContainer");
    </script>
  </body>
</html>

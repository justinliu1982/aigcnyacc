<!-- ===== 组织学校奖项查询 ===== -->
<div>
  <!-- 查询表单区域 -->
  <div x-show="!schoolQuerySubmitted" class="p-[30px] w-[1100px] bg-[#EBE6FA]" style="border-radius: 32px; box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.08);">
    <!-- 第一行：比赛年份、阶段、学校名称 -->
    <div class="flex gap-[24px]">
      <div class="w-[290px] text-sm flex items-center rounded-[16px] pl-[16px] pt-[16px] pb-[16px] pr-[5px] h-[48px] bg-white">
        <span style="border-right: 1px solid #9162ff" class="pr-2 text-black/60 flex-shrink-0">比赛年份</span>
        <div class="select-arrow-wrapper flex-1 min-w-0">
          <select class="border-0 pl-3 pr-3 outline-none bg-transparent p-0 leading-normal w-auto m-0 text-base" style="color: #9162ff" x-model="matchYear">
            <option value="" disabled>请选择年份</option>
            <option value="2026">2026</option>
          </select>
        </div>
      </div>
      <div class="w-[290px] text-sm flex items-center rounded-[16px] pl-[16px] pt-[16px] pb-[16px] pr-[5px] h-[48px] bg-white">
        <span class="pr-2 text-black/60 flex-shrink-0" style="border-right: 1px solid #9162ff">阶段</span>
        <div class="select-arrow-wrapper flex-1 min-w-0">
          <select class="border-0 pl-3 outline-none bg-transparent p-0 leading-normal w-auto m-0 text-base" style="color: #9162ff; font-size: 16px" x-model="matchLevel">
            <option value="" disabled>请选择阶段</option>
            <option value="PROVINCE">省选拔赛</option>
            <option value="NATIONAL">国赛</option>
          </select>
        </div>
      </div>
      <div class="w-[412px] overflow-hidden rounded-[16px] text-sm flex items-center pl-[16px] pt-[16px] pb-[16px] pr-[5px] h-[48px] bg-white">
        <span class="pr-2 text-black/60 flex-shrink-0" style="border-right: 1px solid #9162ff">学校名称</span>
        <input class="flex-1 ml-2 text-[16px] border-0 outline-none focus:outline-none!important focus:ring-0!important" type="text" placeholder="输入学校名称" x-model="schoolQueryName" />
      </div>
    </div>
    <!-- 第二行：校验码 -->
    <div class="flex gap-[24px] mt-[24px]">
      <div class="w-[290px] overflow-hidden rounded-[16px] text-sm flex items-center pl-[16px] pt-[16px] pb-[16px] pr-[5px] h-[48px] bg-white">
        <span class="pr-2 text-black/60 flex-shrink-0" style="border-right: 1px solid #9162ff">校验码</span>
        <input class="flex-1 ml-2 text-[16px] border-0 outline-none focus:outline-none!important focus:ring-0!important" type="text" placeholder="输入校验码" x-model="contestantVerifyCode" />
        <div class="flex-shrink-0 ml-[8px] w-[100px] h-[36px] flex items-center justify-center cursor-pointer" style="overflow: hidden" @click="refreshCaptcha()">
          <img :src="captchaImgSrc" alt="校验码" class="w-full h-full object-contain" />
        </div>
      </div>
    </div>
    <div class="flex flex-col">
      <div class="mt-[24px] text-base text-black/80 font-normal">说明</div>
      <div class="text-sm text-black/60 mt-[4px]">请输入学校名称，查询奖项申请结果。</div>
    </div>
  </div>

  <!-- 提交成功展示区域 -->
  <div x-show="schoolQuerySubmitted">
    <!-- 顶部：返回查询 -->
    <div class="flex justify-end mb-[20px]">
      <div class="px-[20px] h-[38px] flex items-center justify-center text-[16px] font-medium cursor-pointer bg-[rgba(240, 235, 251, 1)]" style="border-radius: 30px; border: 1px solid rgba(145, 98, 255, 1); color: rgba(145, 98, 255, 1);" @click="schoolQuerySubmitted = false; showQueryBtn = true; showQueryTabs = true">
        <img src="./img/return_icon_img.png" class="w-[18px] h-[18px]" />
        <span class="pl-[10px]">返回查询</span>
      </div>
    </div>

    <!-- 白色卡片 -->
    <div class="bg-white p-[40px] rounded-[32px] mt-[29px] relative" style="border: 5px solid rgba(201, 179, 252, 1);">
      <div class="absolute w-[380px] top-[-25px] left-1/2 -translate-x-1/2">
        <img src="./img/award_icon.png" alt="award icon" class="w-[380px] h-[67px]" onerror="this.style.display='none'" />
        <div class="absolute top-[60%] left-1/2 -translate-x-1/2 -translate-y-2/2 text-[rgba(135,66,219,1)] text-[22px] font-medium">组织学校奖项查询</div>
      </div>
      <!-- 标题区域 -->
      <div class="text-center">
        <div class="mt-[10px] text-[rgb(158,164,176)] text-[18px] font-medium leading-[30px]">
          恭喜“<span x-text="schoolQueryName || '-'"></span>”在“<span x-text="(matchYear || '') + '年'"></span>全国青少年人工智能辅助生成数字艺术创作者大赛”中表现优异！
        </div>
      </div>

      <!-- 可申请奖项 -->
      <div class="mt-[32px]">
        <!-- 分隔线 + 标签 -->
        <div class="flex w-[896px] m-auto items-center cursor-pointer" @click="cycleSchoolAwardSituation()">
          <div class="flex-1 h-[2px]" style="background: linear-gradient(270deg, #9162ff 0%, rgba(145, 98, 255, 0) 100%)"></div>
          <div class="w-[10px] h-[10px] items-center justify-center flex" style="border-radius: 50%; background: linear-gradient(180deg, rgba(192, 98, 255, 1) 0%, rgba(144, 114, 255, 1) 100%);">
            <div class="w-[4px] h-[4px] bg-[#fff] flex rounded-full"></div>
          </div>
          <div class="flex-shrink-0 mx-[15px] w-[200px] h-[46px] relative" style="border-radius: 20px; background: linear-gradient(180deg, rgba(192, 98, 255, 1) 0%, rgba(144, 114, 255, 1) 100%); padding: 3px;">
            <div class="w-full h-full flex justify-center items-center text-[20px] font-medium text-[#8742DB] bg-[#F0EBFB]" style="border-radius: 17px;">可申请奖项</div>
          </div>
          <div class="w-[10px] h-[10px] items-center justify-center flex" style="border-radius: 50%; background: linear-gradient(180deg, rgba(192, 98, 255, 1) 0%, rgba(144, 114, 255, 1) 100%);">
            <div class="w-[4px] h-[4px] bg-[#fff] flex rounded-full"></div>
          </div>
          <div class="flex-1 h-[2px]" style="background: linear-gradient(90deg, #9162ff 0%, rgba(145, 98, 255, 0) 100%)"></div>
        </div>

        <!-- 奖项卡片 -->
        <div class="mt-[20px] flex justify-center gap-[16px] flex-nowrap">
          <template x-for="(award, index) in schoolAwardLevels" :key="award.name">
            <div class="w-[200px] p-[16px] rounded-[20px] bg-white relative text-center" style="border: 1px solid rgba(145, 98, 255, 0.3); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06)">
              <div class="mt-[8px] text-[15px] font-bold leading-tight" :style="{ color: award.color }" x-text="award.name"></div>
              <div class="mt-[14px]">
                <div class="w-[140px] h-[44px] m-auto flex rounded-full items-center justify-center cursor-pointer shadow-lg" style="background: linear-gradient(180deg, #c062ff 0%, #9072ff 100%)" @click="openSchoolCertDetail()">
                  <span class="text-[14px] font-bold text-white">查看详情</span>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
</div>

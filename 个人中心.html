<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人中心</title>
  <script src="./browser@4.js"></script>
  <script src="./order-store.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js" defer></script>
  <style>
    [x-cloak] { display: none !important; }
    html { font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
    body { margin: 0; background: #f7f8fd; }
    .u-menu-item { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 20px; margin: 0 12px; border-radius: 10px; cursor: pointer; color: #55556a; font-size: 15px; }
    .u-menu-item:hover { background: rgba(255, 255, 255, 0.65); }
    .u-menu-item.active { background: #fff; color: #8742DB; font-weight: 600; }
    .u-tab { position: relative; padding: 0 4px 14px 4px; cursor: pointer; font-size: 16px; color: #6b6b80; }
    .u-tab.active { color: #8742DB; font-weight: 600; }
    .u-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 2px; background: #8742DB; }
    .u-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #8742DB; color: #fff; font-size: 12px; }
    .u-btn { display: inline-flex; align-items: center; justify-content: center; height: 30px; padding: 0 12px; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .u-btn-outline { border: 1px solid #c9c9d6; color: #55556a; background: #fff; }
    .u-btn-outline:hover { border-color: #8742DB; color: #8742DB; }
    .u-btn-solid { background: #8742DB; color: #fff; }
    .u-btn-solid:hover { background: #7534c4; }
    .u-btn-gray { background: #f0f0f5; color: #8888a0; }
    .u-th, .u-td { padding: 18px 12px; font-size: 14px; vertical-align: middle; }
    .u-th { color: #55556a; font-weight: 600; background: #fafafd; }
    .u-tr { border-top: 1px solid #f0f0f5; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>

<body x-data="userCenter()" x-cloak>
  <div class="flex min-h-screen">

    <!-- ===== 左侧边栏 ===== -->
    <aside class="w-[240px] flex-shrink-0" style="background: #ebe7fb;">
      <!-- Logo -->
      <a href="./inquire.html" class="flex items-center gap-[10px] px-[20px] h-[62px] cursor-pointer" title="返回大赛查询">
        <div class="w-[30px] h-[30px] rounded-[8px] flex items-center justify-center text-white font-bold text-[17px]" style="background: #874ee9;">A</div>
        <div class="text-[16px] font-bold text-[#2b2b3a]">AIGCNYACC大赛</div>
      </a>

      <!-- 用户卡片 -->
      <div class="mx-[12px] mt-[8px] bg-white rounded-[16px] px-[16px] py-[20px] text-center">
        <div class="w-[60px] h-[60px] rounded-full mx-auto flex items-center justify-center text-white text-[26px] font-medium" style="background: #8742DB;">张</div>
        <div class="mt-[10px] text-[16px] font-semibold text-[#2b2b3a]">张明华</div>
        <div class="mt-[4px] text-[12px] text-[#9a9aae]">账号ID：AIGC2026-0388</div>
        <div class="mt-[10px] inline-flex items-center gap-[4px] px-[10px] h-[24px] rounded-full text-[12px]" style="background: #e7f7ee; color: #21a366;">
          <span>📱</span><span>手机已绑定</span>
        </div>
      </div>

      <!-- 菜单 -->
      <nav class="mt-[18px] pb-[24px]">
        <div class="px-[24px] mb-[8px] text-[13px] text-[#8f8fa8]">个人中心</div>
        <template x-for="item in menu" :key="item.key">
          <div class="u-menu-item" :class="activeMenu === item.key ? 'active' : ''" @click="activeMenu = item.key">
            <span class="text-[16px]" x-text="item.icon"></span>
            <span class="flex-1" x-text="item.label"></span>
            <span class="u-badge" x-show="item.badge" x-text="item.badge"></span>
          </div>
        </template>
      </nav>
    </aside>

    <!-- ===== 主内容区 ===== -->
    <main class="flex-1 min-w-0 flex flex-col">
      <!-- 顶部栏 -->
      <header class="h-[62px] flex-shrink-0 flex items-center justify-end gap-[18px] px-[32px]">
        <div class="w-[34px] h-[34px] rounded-[10px] flex items-center justify-center cursor-pointer bg-white text-[16px]">🔍</div>
        <div class="relative w-[34px] h-[34px] rounded-[10px] flex items-center justify-center cursor-pointer bg-white text-[16px]">
          🔔
          <span class="absolute top-[5px] right-[6px] w-[7px] h-[7px] rounded-full" style="background: #ff4d4f;"></span>
        </div>
        <div class="flex items-center gap-[8px] cursor-pointer">
          <div class="w-[34px] h-[34px] rounded-full flex items-center justify-center text-white text-[15px]" style="background: #8742DB;">张</div>
          <span class="text-[14px] text-[#2b2b3a]">张明华</span>
        </div>
      </header>

      <!-- 内容 -->
      <div class="flex-1 px-[32px] pb-[40px]">
        <!-- Tabs -->
        <div class="flex items-center gap-[36px] border-b border-[#ebeaf2]">
          <div class="u-tab" :class="activeTab === 'cert' ? 'active' : ''" @click="activeTab = 'cert'">
            我的证书 <span class="u-badge ml-[4px]">11</span>
          </div>
        </div>

        <!-- 我的证书 -->
        <div x-show="activeTab === 'cert'" class="mt-[20px]">
          <div class="bg-white rounded-[16px] p-[24px]">
            <!-- 赛事筛选 -->
            <div class="relative inline-block">
              <select class="appearance-none bg-white border border-[#dddcE8] rounded-[10px] h-[40px] pl-[16px] pr-[36px] text-[15px] text-[#2b2b3a] outline-none cursor-pointer" x-model="matchName">
                <option value="2025-2026">第一届大赛(2025-2026)</option>
              </select>
              <span class="absolute right-[14px] top-1/2 -translate-y-1/2 pointer-events-none text-[#8f8fa8]">▾</span>
            </div>

            <!-- 证书表格 -->
            <div class="mt-[20px]">
              <table class="w-full border-collapse">
                <thead>
                  <tr>
                    <th class="u-th text-left" style="width: 210px;">证书名称</th>
                    <th class="u-th text-left" style="width: 90px;">奖项</th>
                    <th class="u-th text-left" style="width: 170px;">参赛作品</th>
                    <th class="u-th text-left" style="width: 90px;">比赛阶段</th>
                    <th class="u-th text-left" style="width: 100px;">证书确认</th>
                    <th class="u-th text-left" style="width: 110px;">报名来源</th>
                    <th class="u-th text-left" style="width: 110px;">申领状态</th>
                    <th class="u-th text-left">操作</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(c, i) in certs" :key="i">
                    <tr class="u-tr">
                      <td class="u-td" style="color: #8742DB;" x-text="c.name"></td>
                      <td class="u-td" style="color: #55556a;" x-text="c.award"></td>
                      <td class="u-td" style="color: #55556a;" x-text="c.work"></td>
                      <td class="u-td" style="color: #55556a;" x-text="c.stage"></td>
                      <td class="u-td">
                        <span :style="c.confirm === '已确认' ? 'color:#21a366;' : 'color:#9a9aae;'" x-text="c.confirm"></span>
                      </td>
                      <td class="u-td" style="color: #55556a;" x-text="c.source"></td>
                      <td class="u-td">
                        <span :style="claimStatusColor(c)" x-text="claimStatus(c)"></span>
                      </td>
                      <td class="u-td">
                        <div class="flex flex-wrap gap-[8px]">
                          <a class="u-btn u-btn-outline" :href="'./证书详情.html?name=' + encodeURIComponent(c.name) + '&work=' + encodeURIComponent(c.work) + '&source=' + encodeURIComponent(c.source)">查看详情</a>
                          <span class="u-btn u-btn-outline" @click="openClaimRecords(c)">申领记录</span>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ===== 确认证书信息 ===== -->
  <div x-show="showConfirmInfo" x-cloak class="fixed inset-0 z-[80] flex items-center justify-center"
    style="background: rgba(0, 0, 0, 0.35)" @click.self="showConfirmInfo = false">
    <div class="bg-white rounded-[16px] w-[420px] max-w-[92vw] p-[26px]">
      <div class="flex items-center justify-between">
        <div class="text-[18px] font-bold text-[#2b2b3a]">确认证书信息</div>
        <div class="w-[28px] h-[28px] flex items-center justify-center rounded-full cursor-pointer text-[16px] text-[#b0b0c0] hover:text-[#55556a] hover:bg-[#f4f4f8]"
          @click="showConfirmInfo = false">✕</div>
      </div>
      <div class="mt-[16px] text-center py-[8px]">
        <div class="text-[36px]">⚠️</div>
        <p class="mt-[12px] text-[14px] leading-[1.8] text-[#1a1a2e]">请先确认证书信息后再进行申领。</p>
      </div>
      <div class="mt-[18px] flex justify-end gap-[12px]">
        <div class="u-btn u-btn-outline" style="height: 38px; padding: 0 20px; font-size: 14px;" @click="showConfirmInfo = false">取消</div>
        <div class="u-btn u-btn-solid" style="height: 38px; padding: 0 20px; font-size: 14px;" @click="goConfirmInfo()">确认</div>
      </div>
    </div>
  </div>

  <!-- ===== 申领记录 ===== -->
  <div x-show="showClaimRecords" x-cloak class="fixed inset-0 z-[80] flex items-center justify-center"
    style="background: rgba(0, 0, 0, 0.35)" @click.self="showClaimRecords = false">
    <div class="bg-white rounded-[16px] w-[760px] max-w-[94vw] max-h-[86vh] overflow-y-auto p-[26px]">
      <div class="flex items-center justify-between">
        <div class="text-[18px] font-bold text-[#2b2b3a]">申领记录</div>
        <div class="w-[28px] h-[28px] flex items-center justify-center rounded-full cursor-pointer text-[16px] text-[#b0b0c0] hover:text-[#55556a] hover:bg-[#f4f4f8]"
          @click="showClaimRecords = false">✕</div>
      </div>

      <div class="mt-[16px]">
        <div x-show="records().length === 0" class="text-center py-[48px] text-[14px]" style="color: #9a9aae;">
          暂无申领订单
        </div>

        <template x-for="o in records()" :key="o.orderNo">
          <div class="flex items-center gap-[16px] rounded-[10px] px-[16px] py-[14px] mb-[10px]" style="background: #fbfbfd;">
            <div class="flex-1 min-w-0">
              <div class="text-[14px] font-semibold text-[#2b2b3a]" x-text="o.certName + ' · ' + o.certWork"></div>
              <div class="mt-[4px] text-[12px]" style="color: #9a9aae;"
                x-text="'订单号：' + o.orderNo + '　金额：￥' + o.amount.toFixed(2) + '　下单：' + fmtTime(o.createTime)"></div>
            </div>
            <div class="text-[13px] font-semibold flex-shrink-0" :style="recordStatusColor(o.status)" x-text="recordStatusText(o.status)"></div>
            <div class="flex gap-[8px] flex-shrink-0">
              <span x-show="o.status === 'pending'" class="u-btn u-btn-solid" @click="openPay(o.orderNo)">去支付</span>
              <a x-show="o.status !== 'pending'" class="u-btn u-btn-outline"
                :href="'./订单详情.html?orderNo=' + encodeURIComponent(o.orderNo)">订单详情</a>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- ===== 二维码支付 ===== -->
  <div x-show="showPay" x-cloak class="fixed inset-0 z-[90] flex items-center justify-center"
    style="background: rgba(0, 0, 0, 0.35)" @click.self="showPay = false">
    <div class="bg-white rounded-[16px] w-[440px] max-w-[92vw] p-[28px]">
      <div class="flex items-center justify-between">
        <div class="text-[18px] font-bold text-[#2b2b3a]">扫码支付</div>
        <div class="w-[28px] h-[28px] flex items-center justify-center rounded-full cursor-pointer text-[16px] text-[#b0b0c0] hover:text-[#55556a] hover:bg-[#f4f4f8]"
          @click="showPay = false">✕</div>
      </div>

      <div class="mt-[16px] flex flex-col items-center">
        <img src="./img/ewm.png" class="w-[170px] h-[170px]" alt="支付二维码" />
        <div class="mt-[12px] text-[22px] font-bold" style="color: #8742DB;"
          x-text="'￥' + (payOrder ? payOrder.amount.toFixed(2) : '0.00')"></div>
        <div class="mt-[8px] text-[13px]" style="color: #e08a2b;">二维码有效期 15 分钟，请尽快完成支付</div>
      </div>

      <div class="mt-[20px] flex justify-end">
        <span class="text-[12px] cursor-pointer hover:underline" style="color: #b0b0c0;" @click="completePay()">我已完成支付</span>
      </div>
    </div>
  </div>

  <!-- ===== 轻提示 ===== -->
  <div x-show="showToast" x-cloak class="fixed left-1/2 -translate-x-1/2 z-[120] px-[22px] h-[44px] flex items-center rounded-full text-[14px] text-white"
    :style="'bottom: 48px; background: ' + (toastType === 'success' ? '#21a366' : toastType === 'error' ? '#ff4d4f' : '#e08a2b') + '; animation: toastIn .2s ease;'"
    x-text="toastMsg"></div>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('userCenter', () => ({
        activeMenu: 'cert',
        activeTab: 'cert',
        matchName: '2025-2026',
        menu: [
          { key: 'account', icon: '⚙️', label: '账号设置' },
          { key: 'signup', icon: '📋', label: '参赛报名' },
          { key: 'status', icon: '📊', label: '报名状态' },
          { key: 'score', icon: '🏆', label: '我的成绩' },
          { key: 'cert', icon: '🎓', label: '我的证书' },
          { key: 'notice', icon: '🔔', label: '大赛通知', badge: 3 },
          { key: 'feedback', icon: '💬', label: '问题反馈' },
        ],
        certs: [
          { name: '大赛获奖证书', award: '一等奖', work: '《数字苏园·光影戏梦》', stage: '省赛', confirm: '已确认', status: '已寄出', statusColor: 'color:#21a366;', source: '官网报名', applied: true, feedback: true },
          { name: '大赛获奖证书', award: '二等奖', work: '《城市之光》', stage: '省赛', confirm: '未确认', status: '已由北京新艺教育科技有限公司统一下单', statusColor: 'color:#e08a2b;', source: '组织单位报名', applied: false, feedback: false },
          { name: '艺术品一物一码溯源注册登记证书', award: '--', work: '《数字苏园·光影戏梦》', stage: '省赛', confirm: '已确认', status: '已寄出', statusColor: 'color:#21a366;', source: '官网报名', applied: true, feedback: false },
          { name: '艺术品一物一码溯源注册登记证书', award: '--', work: '《城市之光》', stage: '省赛', confirm: '已确认', status: '未申领', statusColor: 'color:#9a9aae;', source: '官网报名', applied: false, feedback: false },
          { name: '社会实践证书', award: '--', work: '参赛者：张明华', stage: '省赛', confirm: '已确认', status: '未申领', statusColor: 'color:#9a9aae;', source: '官网报名', applied: false, feedback: false },
          { name: '创作者注册登记证书', award: '--', work: '参赛者：张明华', stage: '省赛', confirm: '已确认', status: '支付失败', statusColor: 'color:#ff4d4f;', source: '官网报名', applied: true, feedback: false },
          { name: '参赛证书', award: '--', work: '参赛者：张明华', stage: '省赛', confirm: '已确认', status: '未申领', statusColor: 'color:#9a9aae;', source: '官网报名', applied: false, feedback: false },
          { name: '大赛获奖证书', award: '三等奖', work: '《山海湖源》', stage: '国赛', confirm: '未确认', status: '已由北京新艺教育科技有限公司统一下单', statusColor: 'color:#e08a2b;', source: '组织单位报名', applied: false, feedback: false },
          { name: '国家入编证书', award: '--', work: '《数字苏园·光影戏梦》', stage: '国赛', confirm: '已确认', status: '未申领', statusColor: 'color:#9a9aae;', source: '官网报名', applied: false, feedback: false },
          { name: '社会实践证书', award: '--', work: '参赛者：张明华', stage: '国赛', confirm: '未确认', status: '未申领', statusColor: 'color:#9a9aae;', source: '官网报名', applied: false, feedback: false },
          { name: '参赛证书', award: '--', work: '参赛者：张明华', stage: '国赛', confirm: '已确认', status: '未申领', statusColor: 'color:#9a9aae;', source: '官网报名', applied: false, feedback: false },
        ],

        // ===== 申领订单 =====
        ordersVersion: 0,
        refreshOrders() { this.ordersVersion++; },

        // 列表中某证书的申领状态（无订单显示未申领）
        claimStatus(c) {
          this.ordersVersion; // 建立响应式依赖
          const o = window.OrderStore.orderOfCert(c.name, c.work);
          return o ? (window.OrderStore.STATUS_TEXT[o.status] || o.status) : '未申领';
        },
        claimStatusColor(c) {
          this.ordersVersion;
          const o = window.OrderStore.orderOfCert(c.name, c.work);
          const map = { pending: '#e08a2b', paid: '#1677ff', confirmed: '#21a366', invoiced: '#9a9aae' };
          return 'color:' + (o ? (map[o.status] || '#9a9aae') : '#9a9aae') + ';';
        },

        // 申领记录（全部订单）
        records() {
          this.ordersVersion;
          return window.OrderStore.getOrders();
        },
        recordStatusText(s) { return window.OrderStore.STATUS_TEXT[s] || s; },
        recordStatusColor(s) {
          const map = { pending: '#e08a2b', paid: '#1677ff', confirmed: '#21a366', invoiced: '#9a9aae' };
          return 'color:' + (map[s] || '#9a9aae') + ';';
        },
        fmtTime(ts) { return window.OrderStore.fmtTime(ts); },

        showClaimRecords: false,
        showConfirmInfo: false,
        confirmInfoCert: null,
        openClaimRecords(c) {
          // 未确认证书信息时，先提示确认
          if (c.confirm !== '已确认') {
            this.confirmInfoCert = c;
            this.showConfirmInfo = true;
            return;
          }
          this.showClaimRecords = true;
        },
        goConfirmInfo() {
          const c = this.confirmInfoCert;
          if (!c) return;
          location.href = './证书详情.html?name=' + encodeURIComponent(c.name)
            + '&work=' + encodeURIComponent(c.work) + '&source=' + encodeURIComponent(c.source);
        },

        // 去支付
        showPay: false,
        payOrderNo: '',
        get payOrder() {
          this.ordersVersion;
          return window.OrderStore.getOrder(this.payOrderNo);
        },
        openPay(orderNo) {
          this.payOrderNo = orderNo;
          this.showPay = true;
        },
        completePay() {
          window.OrderStore.markPaid(this.payOrderNo);
          this.showPay = false;
          this.refreshOrders();
          this.showToastMsg('支付成功', 'success');
        },

        // ===== 轻提示 =====
        showToast: false,
        toastMsg: '',
        toastType: 'success',
        toastTimer: null,
        showToastMsg(msg, type) {
          this.toastMsg = msg;
          this.toastType = type || 'success';
          this.showToast = true;
          clearTimeout(this.toastTimer);
          this.toastTimer = setTimeout(() => { this.showToast = false; }, 2400);
        },
      }));
    });
  </script>
</body>
</html>

  <style>
    * {
      line-height: normal;
    }

    .awardsTitle {
      background: var(--Color-5, #d8cdff);
      box-shadow: 4px 4px 24px 4px rgba(0, 0, 0, 0.08);
    }

    .awardsItem {
      width: calc((100% - 120px) / 4);
      margin-right: 40px;
      margin-bottom: 40px;
      border-radius: 24px;
      background: var(---100, #fff);

      /* 卡片投影 */
      box-shadow: 4px 4px 24px 4px rgba(0, 0, 0, 0.08);
    }

    .awardsItem:nth-child(4n) {
      margin-right: 0;
    }
    .award_content {
      background-image: url("./img/award_bg.png");
      background-position: 0 0;
      background-size: 30%;
      background-repeat: no-repeat;
      background-position: 100% 0;
    }
    .trophy_content {
      background-image: url("./img/trophy.png");
      background-position: 95% 0;
      background-repeat: no-repeat;
    }
    .trophy_item {
      font-size: 24px;
      color: var(---80, rgba(0, 0, 0, 0.8));
      text-align: center;
      font-size: 24px;
      background-color: var(--Color-8, #f7f5ff);
      font-weight: 400;
      font-style: normal;
      position: relative;
    }
    .trophy_item:hover {
      background-color: var(--Color, #9162ff);
      color: #fff;
      transition: all 0.3s;
      cursor: pointer;
      visibility: visible;
    }
    .trophy_item:hover .item_svg {
      position: absolute;
      visibility: visible;
      right: 10px;
    }
    .item_svg {
      visibility: hidden;
      position: absolute;
      right: 10px;
    }
    /* 省赛时隐藏的区域样式 */
    .hide-on-province {
      transition: all 0.3s ease;
    }
    .hide-on-province.hide {
      display: none;
    }
  </style>

    <!-- 动态加载公共部分 -->
    <script>
      // 初始化所有tab切换功能
      function initTabs() {
        // 参赛选手类切换
        const playerTabs = document.querySelectorAll('.player-tab-group [data-role="tab"]');
        const hideOnProvinceElements = document.querySelectorAll('.hide-on-province');
        
        playerTabs.forEach(tab => {
          tab.addEventListener('click', function() {
            const type = this.getAttribute('data-type');
            const parentGroup = this.closest('.player-tab-group');
            const allTabs = parentGroup.querySelectorAll('[data-role="tab"]');
            
            // 更新样式
            allTabs.forEach(t => {
              if (t === this) {
                t.classList.add('bg-white');
                t.classList.remove('text-white');
                t.classList.add('text-black/60');
                t.style.color = '';
              } else {
                t.classList.remove('bg-white');
                t.classList.remove('text-black/60');
                t.style.color = 'rgba(255,255,255,0.8)';
              }
            });
            
            // 根据类型控制需要隐藏的区域
            if (type === 'national') {
              // 国赛：显示所有隐藏区域
              hideOnProvinceElements.forEach(el => {
                el.classList.remove('hide');
              });
            } else if (type === 'province') {
              // 省赛：隐藏所有指定区域
              hideOnProvinceElements.forEach(el => {
                el.classList.add('hide');
              });
            }
          });
        });
        
        // 教师类切换（仅样式切换，内容无变化）
        const teacherTabs = document.querySelectorAll('.teacher-tab-group [data-role="tab"]');
        teacherTabs.forEach(tab => {
          tab.addEventListener('click', function() {
            const parentGroup = this.closest('.teacher-tab-group');
            const allTabs = parentGroup.querySelectorAll('[data-role="tab"]');
            
            allTabs.forEach(t => {
              if (t === this) {
                t.classList.add('bg-white');
                t.classList.remove('text-white');
                t.classList.add('text-black/60');
                t.style.color = '';
              } else {
                t.classList.remove('bg-white');
                t.classList.remove('text-black/60');
                t.style.color = 'rgba(255,255,255,0.8)';
              }
            });
          });
        });
        
        // 学校类切换（仅样式切换，内容无变化）
        const schoolTabs = document.querySelectorAll('.school-tab-group [data-role="tab"]');
        schoolTabs.forEach(tab => {
          tab.addEventListener('click', function() {
            const parentGroup = this.closest('.school-tab-group');
            const allTabs = parentGroup.querySelectorAll('[data-role="tab"]');
            
            allTabs.forEach(t => {
              if (t === this) {
                t.classList.add('bg-white');
                t.classList.remove('text-white');
                t.classList.add('text-black/60');
                t.style.color = '';
              } else {
                t.classList.remove('bg-white');
                t.classList.remove('text-black/60');
                t.style.color = 'rgba(255,255,255,0.8)';
              }
            });
          });
        });
      }
      
      // 加载公共文件的函数
      async function loadCommonPart(url, containerId) {
        try {
          const response = await fetch(url);
          const html = await response.text();
          document.getElementById(containerId).innerHTML = html;
          if (containerId === "headerContainer") {
            // 动态导入 header.js
            const { initHeader } = await import("./header.js");
            // 给一点延迟确保 DOM 完全渲染
            setTimeout(initHeader, 10);
          }
        } catch (error) {
          console.error("加载公共部分失败：", error);
        }
      }

      // 加载头部和底部
      loadCommonPart("./header.html", "headerContainer");
      loadCommonPart("./footer.html", "footerContainer");
      
      // 等待DOM完全加载后初始化tab功能
      document.addEventListener('DOMContentLoaded', function() {
        initTabs();
      });
    </script>
